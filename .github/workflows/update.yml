name: Update FlowDiv data

on:
  workflow_dispatch:
  schedule:
    # Taiwan time: 14:30, 15:30, 16:30, 18:30 Mon-Fri
    - cron: "30 6,7,8,10 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update market data
        run: node scripts/update.js
      - name: Commit updated JSON
        run: |
          git config user.name "flowdiv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: update market data"
          git push
